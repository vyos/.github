name: force_workspace backport companion (reusable)

on:
  workflow_call:
    inputs:
      mergify_comment_id:
        required: true
        type: string
      mergify_comment_body:
        required: true
        type: string
      target_pr_number:
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

# Serialize force_workspace runs per target PR so two near-simultaneous triggers can't both pass
# the idempotency check before either PR exists (adversarial round-2 finding). Queue, don't cancel —
# the second run then sees the first's PR via idempotency and no-ops.
concurrency:
  group: force-workspace-${{ github.repository }}-${{ inputs.target_pr_number }}
  cancel-in-progress: false

jobs:
  parse-and-validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.parse.outputs.sha }}
      target_branch: ${{ steps.parse.outputs.target_branch }}
      consumer_force_workspace_enabled: ${{ steps.validate.outputs.enabled }}
      consumer_backport_branches: ${{ steps.validate.outputs.consumer_backport_branches }}
      skip: ${{ steps.idempotency.outputs.skip }}
    steps:
      # NOTE: no third-party action (e.g. Bullfrog) before the token-minting step — keeping
      # untrusted actions out of jobs that handle secrets.APP_PRIVATE_KEY avoids a token-theft
      # surface (adversarial-review finding). Egress-audit belongs on no-secret jobs only.
      # get-token is a COMPOSITE action (v7) — called at step level; output is job-local.
      - name: Mint App token
        id: token
        uses: vyos/.github/.github/actions/get-token@production
        with:
          owner: VyOS-Networks
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      # F3 (provenance): re-verify the trigger inside the reusable (do NOT trust the wrapper's
      # `if:` alone). Re-FETCH the comment by id with the App token (authoritative — don't trust
      # the passed body either), assert author == mergify[bot] AND body contains the failure marker.
      - name: Re-verify Mergify provenance + parse (anchored)
        id: parse
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ inputs.mergify_comment_id }}
        run: |
          set -euo pipefail
          # Authoritative re-fetch of the comment (issue comments REST: PR comments are issue comments).
          comment_json=$(gh api "repos/${REPO}/issues/comments/${COMMENT_ID}")
          author=$(echo "$comment_json" | jq -r '.user.login')
          if [ "$author" != "mergify[bot]" ]; then
            echo "::error::provenance check failed — comment author is '$author', not 'mergify[bot]'; aborting"
            exit 1
          fi
          echo "$comment_json" | jq -r '.body' > /tmp/mergify_comment_body.txt
          if ! grep -qF "No backport have been created" /tmp/mergify_comment_body.txt; then
            echo "::error::provenance check failed — body lacks the 'No backport have been created' marker; aborting"
            exit 1
          fi
          # F5 (anchoring + ambiguity): extract the SHA + target branch, requiring EXACTLY ONE
          # distinct candidate of each across the comment. The whitelist restricts branches to the
          # active LTS vocabulary (equuleus/1.3 dropped 2026-06-01 — EOL; add a token when an LTS opens).
          BODY="$(cat /tmp/mergify_comment_body.txt)" python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import os, re, sys
          body = os.environ["BODY"]
          BRANCH_RE = r"\b(?:to(?: branch)?|for branch)\s+(sagitta|circinus)\b"
          # SHA anchored to Mergify's commit context ("cherry-pick of commit <sha>" / "Backport of <sha>")
          # so an unrelated bare 40-hex elsewhere (URL, prior-PR reference) is NOT picked up (F5/anchoring).
          SHA_RE = r"\b(?:commit|Backport of)\s+([0-9a-f]{40})\b"
          shas = sorted(set(re.findall(SHA_RE, body, re.IGNORECASE)))
          branches = sorted({m.lower() for m in re.findall(BRANCH_RE, body, re.IGNORECASE)})
          if len(shas) != 1 or len(branches) != 1:
              print(f"Parse failed/ambiguous — distinct SHAs={shas}, branches={branches} (require exactly 1 each)", file=sys.stderr)
              print("\n".join(body.splitlines()[:20]), file=sys.stderr)
              sys.exit(1)
          print(f"sha={shas[0]}")
          print(f"target_branch={branches[0]}")
          print(f"Parsed: SHA={shas[0]}, target_branch={branches[0]}", file=sys.stderr)
          PYEOF

      - name: Read consumers.yaml + validate
        id: validate
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fetch consumers.yaml from VyOS-Networks/.github@production (relocated in Rollout 2 v5;
          # private repo — the App token has Contents:read on it).
          curl -sH "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/VyOS-Networks/.github/contents/mirror/consumers.yaml?ref=production" \
            | jq -r '.content' | base64 -d > /tmp/consumers.yaml

          # Find the consumer entry where target == this repo. REPO is passed via env and read with
          # os.environ — NOT interpolated into the python3 source (F6 hardening; no injection surface).
          consumer=$(REPO="$REPO" python3 - <<'PYEOF'
          import yaml, json, sys, os
          repo = os.environ["REPO"]
          d = yaml.safe_load(open('/tmp/consumers.yaml'))
          for c in d['consumers']:
              if c['target'] == repo:
                  print(json.dumps(c))
                  sys.exit(0)
          print('')
          PYEOF
          )
          if [ -z "$consumer" ]; then
            echo "Repo $REPO not found in consumers.yaml; aborting" >&2
            exit 1
          fi
          enabled=$(echo "$consumer" | jq -r '.force_workspace_enabled // false')
          backport_branches=$(echo "$consumer" | jq -c '.backport_branches // ["sagitta","circinus"]')
          echo "enabled=$enabled" >> $GITHUB_OUTPUT
          # Output name matches the job-level `outputs.consumer_backport_branches` mapping.
          echo "consumer_backport_branches=$backport_branches" >> $GITHUB_OUTPUT

      - name: Validate target branch is in allowlist
        env:
          TARGET_BRANCH: ${{ steps.parse.outputs.target_branch }}
          ALLOWLIST: ${{ steps.validate.outputs.consumer_backport_branches }}
        run: |
          if ! echo "$ALLOWLIST" | jq -e --arg b "$TARGET_BRANCH" 'index($b) != null' >/dev/null; then
            echo "target_branch $TARGET_BRANCH not in allowlist $ALLOWLIST; aborting" >&2
            exit 1
          fi
          echo "target_branch validated against allowlist"

      - name: Idempotency check — does force-backport branch already exist?
        id: idempotency
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.parse.outputs.sha }}
          TARGET: ${{ steps.parse.outputs.target_branch }}
        run: |
          set -euo pipefail
          ref_name="force-backport/${SHA}/${TARGET}"
          skip=false
          # Idempotency: SKIP only when a PR for this deterministic head already exists (any state) —
          # the work is done or in progress. A bare BRANCH with NO PR is NOT a skip: it is a failed
          # prior run (pushed the branch, then errored before opening the PR). Treating branch-existence
          # as a terminal skip would strand it forever (adversarial-review finding) — instead RECOVER
          # (the push step force-overwrites the orphaned branch in our deterministic namespace, then the
          # PR is opened). PR existence is checked across ALL states (a branch + its PR can diverge).
          # Count only SAME-REPO PRs with that head — a fork/cross-repo PR could reuse the head
          # branch name to poison this check and block recovery (adversarial round-2 finding).
          existing_pr=$(gh pr list --repo "${REPO}" --head "${ref_name}" --state all \
            --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)] | length')
          if [ "${existing_pr:-0}" -gt 0 ]; then
            skip=true
            echo "Idempotent skip: a PR with head ${ref_name} already exists (state all)" >&2
          # Singular `git/ref/heads/<name>` → HTTP 404 when ABSENT (the plural `git/refs/...` would
          # return [] with 200 for an absent ref — the prior always-skip bug).
          elif gh api "repos/${REPO}/git/ref/heads/${ref_name}" >/dev/null 2>&1; then
            echo "::warning::orphaned branch refs/heads/${ref_name} exists with NO PR (failed prior run) — recovering: force-overwrite + open PR" >&2
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          [ "$skip" = "true" ] || echo "proceeding for ${ref_name}"

  cherry-pick-and-force-stage:
    needs: [parse-and-validate]
    # Gate on BOTH per-consumer opt-in AND idempotency check (skip if PR/branch already exists).
    if: |
      needs.parse-and-validate.outputs.consumer_force_workspace_enabled == 'true'
      && needs.parse-and-validate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      # NOTE: no third-party action before the token-minting step (token-theft-surface avoidance —
      # adversarial-review finding). This job clones + force-pushes + opens a PR with the App token.
      # Composite get-token (v7) — minted fresh in this job (outputs are job-local).
      - name: Mint App token
        id: token
        uses: vyos/.github/.github/actions/get-token@production
        with:
          owner: VyOS-Networks
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Clone target repo
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git config user.name "vyos-bot[bot]"
          git config user.email "vyos-bot[bot]@users.noreply.github.com"

      - name: Cherry-pick + force-stage unmerged paths (resolve toward source / "theirs")
        id: forcestage
        env:
          SHA: ${{ needs.parse-and-validate.outputs.sha }}
          TARGET: ${{ needs.parse-and-validate.outputs.target_branch }}
        run: |
          set -euo pipefail
          cd repo
          # Reachability (spec §4.2.8 step 3): refuse to force-stage a SHA that is not actually on
          # the mirrored source branch — guards against a crafted/parsed SHA that isn't a real merge.
          src_branch=$(git rev-parse --abbrev-ref origin/HEAD | sed 's@^origin/@@')
          if ! git merge-base --is-ancestor "$SHA" "origin/${src_branch}"; then
            echo "::error::SHA $SHA is not reachable from origin/${src_branch} (the mirrored source branch); refusing to force-stage"
            exit 1
          fi
          git checkout "$TARGET"
          # --no-commit: never let Git auto-create a commit; staging is curated below.
          if git cherry-pick --no-commit "$SHA"; then
            # Unexpected CLEAN apply — the path-drift no longer reproduces (branch moved since
            # Mergify's failure). Open no PR; leave the original Mergify failure for normal retry.
            echo "::warning::cherry-pick of $SHA applied cleanly to $TARGET — no conflict to resolve; opening no force-staged PR"
            git reset --hard HEAD; git cherry-pick --abort 2>/dev/null || true
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Conflict path: classify + resolve each unmerged path toward the cherry-picked SOURCE
          # ("theirs" in cherry-pick terms). The Python exits 2 (→ set -e → job fails RED = fail-closed,
          # no push/PR) if ANY path is not deterministically resolvable. JSONL of decisions on success.
          python3 - <<'PYEOF' > /tmp/decisions.jsonl
          import subprocess, json, sys
          # porcelain v2 unmerged record (NUL-terminated with -z):
          #   u <XY> <sub> <m1> <m2> <m3> <mW> <h1> <h2> <h3> <path>
          # The PATH is the FINAL field — after the three object-id hashes. split(" ", 10) keeps a
          # space-containing path intact in parts[10] (the prior split(" ",8) grabbed "<h2> <h3> <path>").
          out = subprocess.check_output(["git", "status", "--porcelain=v2", "-z"])
          unresolved, decisions = [], []
          for entry in out.split(b"\x00"):
              if not entry:
                  continue
              s = entry.decode("utf-8", errors="replace")
              if not s.startswith("u "):
                  continue
              parts = s.split(" ", 10)
              if len(parts) < 11:
                  unresolved.append(s)
                  decisions.append({"path": s, "xy_code": "?", "classification": "unparseable", "action": "none"})
                  continue
              xy, sub, m1, m2, m3, path = parts[1], parts[2], parts[3], parts[4], parts[5], parts[10]
              # TYPE PRE-CHECK (XY alone is insufficient): submodule / gitlink / type-change → fail-closed.
              modes = [m for m in (m1, m2, m3) if m != "000000"]
              types = {m[:3] for m in modes}            # 100=regular, 120=symlink, 160=gitlink
              if sub[:1] == "S" or "160" in types or len(types) > 1:
                  unresolved.append(path)
                  decisions.append({"path": path, "xy_code": xy, "classification": "unresolved-type", "action": "none"})
                  continue
              # Per-XY resolution toward source ("theirs" = stage 3 = the picked commit).
              if xy in ("UU", "AA"):       # content conflict — take source's version, NOT the marker file
                  subprocess.check_call(["git", "checkout", "--theirs", "--", path])
                  subprocess.check_call(["git", "add", "--", path]); action = "checkout --theirs + add"
              elif xy == "UA":             # added by them (source) → take it
                  subprocess.check_call(["git", "add", "--", path]); action = "add (source add)"
              elif xy == "UD":             # deleted by them (source) → delete
                  subprocess.check_call(["git", "rm", "--", path]); action = "rm (source delete)"
              elif xy == "DU":             # deleted by us (target), modified by source → take source's file
                  subprocess.check_call(["git", "add", "--", path]); action = "add (source modify)"
              elif xy == "DD":             # both deleted
                  subprocess.check_call(["git", "rm", "--", path]); action = "rm (both deleted)"
              else:                        # AU (added by us, source has no opinion) + any unknown XY → fail-closed
                  unresolved.append(path)
                  decisions.append({"path": path, "xy_code": xy, "classification": "unresolved", "action": "none"})
                  continue
              decisions.append({"path": path, "xy_code": xy, "classification": "resolved", "action": action})
          for d in decisions:
              print(json.dumps(d))
          if unresolved:
              sys.stderr.write("::error::FAIL-CLOSED — force_workspace cannot deterministically resolve: %s. No PR opened; resolve the backport manually.\n" % unresolved)
              sys.exit(2)
          PYEOF
          # Reached only when EVERY path resolved (python exited 0).
          decisions_json=$(jq -s '.' /tmp/decisions.jsonl)
          { echo "DECISIONS_JSON<<EOF_DJ"; echo "$decisions_json"; echo "EOF_DJ"; } >> "$GITHUB_ENV"
          if git diff --cached --quiet; then
            echo "::error::no staged changes after resolution (unexpected); aborting"
            exit 1
          fi
          commit_msg=$(printf '%s\n\n%s\n\n%s\n' \
            "force-staged backport of $SHA to $TARGET" \
            "Mergify aborted on a path-drift conflict; auto-resolved by the force_workspace GHA companion toward the cherry-picked source (\"theirs\"). VERIFY each decision before merging." \
            "Decisions: $decisions_json")
          git commit -m "$commit_msg"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Push to deterministic branch
        if: steps.forcestage.outputs.proceed == 'true'
        env:
          SHA: ${{ needs.parse-and-validate.outputs.sha }}
          TARGET: ${{ needs.parse-and-validate.outputs.target_branch }}
        run: |
          cd repo
          branch_name="force-backport/${SHA}/${TARGET}"
          # --force: recover/overwrite an orphaned branch from a failed prior run. Safe — this
          # deterministic force-backport/<sha>/<target> namespace is written exclusively by this bot.
          git push --force origin "HEAD:refs/heads/${branch_name}"

      - name: Ensure required labels exist on the target repo
        if: steps.forcestage.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `gh pr create --label X` fails if label X doesn't exist on the repo.
          # Idempotently create the labels we need (no-op if already present).
          for label_spec in "backport-conflict:ED4C2C:Auto-applied; PR has conflict requiring manual verification" \
                            "force-staged:FBCA04:Auto-resolved by force_workspace GHA; verify each decision"; do
            name="${label_spec%%:*}"; rest="${label_spec#*:}"
            color="${rest%%:*}"; desc="${rest#*:}"
            if ! gh api "repos/$REPO/labels/$name" >/dev/null 2>&1; then
              gh api -X POST "repos/$REPO/labels" \
                -f "name=$name" -f "color=$color" -f "description=$desc"
              echo "Created label: $name"
            else
              echo "Label already exists: $name"
            fi
          done

      - name: Open audit-trail PR
        if: steps.forcestage.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.parse-and-validate.outputs.sha }}
          TARGET: ${{ needs.parse-and-validate.outputs.target_branch }}
          DECISIONS_JSON: ${{ env.DECISIONS_JSON }}
          MERGIFY_COMMENT_ID: ${{ inputs.mergify_comment_id }}
          TARGET_PR_NUMBER: ${{ inputs.target_pr_number }}
        run: |
          set -euo pipefail
          cd repo
          branch_name="force-backport/${SHA}/${TARGET}"
          # F7 (hardening): render the audit trail as a FENCED JSON block, not inline backticks.
          # A fenced ```json block cannot be broken out of by crafted path content (no inline-code-span
          # termination, newlines are literal), and `jq .` already produces valid escaped JSON.
          decisions_block=$(echo "$DECISIONS_JSON" | jq '.')
          body=$(cat <<EOF
          ## force-staged backport of \`$SHA\` to \`$TARGET\`

          Mergify aborted on path-drift conflict. This PR was auto-generated by the
          \`force_workspace\` GHA companion (Plan Rollout 4). The original Mergify
          failure comment: \`#$MERGIFY_COMMENT_ID\` on PR \`#$TARGET_PR_NUMBER\`.

          ### Decisions (VERIFY EACH BEFORE MERGE)

          Each unmerged path was resolved toward the cherry-picked source ("theirs"):

          \`\`\`json
          $decisions_block
          \`\`\`

          ### Verify before merge

          1. Inspect the diff and confirm each forced-stage decision is correct.
          2. If a decision is wrong, fix the conflict manually (revert + cherry-pick + resolve).
          3. Remove the \`backport-conflict\` label only when satisfied.

          The \`merge_protections\` rule (private-side Mergify central config) blocks merge
          while \`backport-conflict\` is present.
          EOF
          )
          # Do NOT swallow failures — failing `gh pr create` must fail the workflow so the
          # operator inspects. Removed the previous `2>/dev/null || echo ""` pattern.
          # --assignee is optional: only set when the triggering event provides a login (issue_comment).
          assignee_flag=()
          if [ -n "${{ github.event.issue.user.login }}" ]; then
            assignee_flag=(--assignee "${{ github.event.issue.user.login }}")
          fi
          pr_number=$(gh pr create \
            --repo "$REPO" \
            --base "$TARGET" \
            --head "$branch_name" \
            --title "force-staged backport of $SHA to $TARGET" \
            --body "$body" \
            --label backport-conflict \
            --label force-staged \
            "${assignee_flag[@]}")
          echo "Opened PR: $pr_number"
