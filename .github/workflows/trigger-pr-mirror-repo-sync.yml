name: Trigger Mirror PR and Repo Sync
on:
  workflow_call:

run-name: Trigger Mirror PR ${{ github.event.pull_request.number }} for ${{ github.event.pull_request.base.ref }} branch

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  SYNC_BRANCH: ${{ github.event.pull_request.base.ref }}
  TARGET_REPO:  ${{ secrets.REMOTE_OWNER }}/${{ secrets.REMOTE_REPO }}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: trigger-pr-mirror-repo-sync-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false
jobs:
  trigger-mirror-pr-repo-sync:
    if: github.event.pull_request.merged == true && github.repository_owner == 'vyos'
    runs-on: ubuntu-latest

    steps:
    - name: Bullfrog Secure Runner
      continue-on-error: true
      uses: bullfrogsec/bullfrog@v0.8.4
      with:
        egress-policy: audit

    - name: Trigger repo sync
      shell: bash
      run: |
        echo "Triggering PR mirror sync workflow in target repo: ${{ env.TARGET_REPO }}, sync branch: ${{ env.SYNC_BRANCH }}, token: ${{ env.GH_TOKEN }}"
        curl -X POST \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
          https://api.github.com/repos/${{ env.TARGET_REPO }}/actions/workflows/mirror-pr-and-sync.yml/dispatches \
          -d '{"ref":"${{ env.SYNC_BRANCH }}", "inputs": {"sync_branch": "${{ env.SYNC_BRANCH }}"}}'
      env:
        GH_TOKEN: ${{ secrets.PAT }}

