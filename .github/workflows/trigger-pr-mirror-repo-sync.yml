name: Trigger Mirror PR and Repo Sync
on:
  workflow_call:

run-name: Trigger Mirror PR ${{ github.event.pull_request.number }} for ${{ github.event.pull_request.base.ref }} branch

env:
  GH_TOKEN: ${{ secrets.PAT }}

concurrency:
  group: trigger-pr-mirror-repo-sync-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false
jobs:
  trigger-mirror-pr-repo-sync:
    if: ${{ github.repository_owner == 'vyos' }}
    runs-on: ubuntu-latest

    steps:
    - name: Bullfrog Secure Runner
      uses: bullfrogsec/bullfrog@v0
      with:
        egress-policy: audit
  
    - name: Add mirror-initiated label
      shell: bash
      run: |
        label_name="mirror-initiated"
        if ! gh label list --repo "$GITHUB_REPOSITORY" | grep -q "^$label_name\b"; then
            echo "Label '$label_name' not found in repo. Creating it..."
            gh label create "$label_name" --color "ff0000" --description "This PR initiated for mirror sync workflow" --repo "$GITHUB_REPOSITORY"
        fi
        gh issue edit ${{ github.event.pull_request.number }} --repo $GITHUB_REPOSITORY --add-label $label_name

    - name: Trigger repo sync
      shell: bash
      run: |
        echo "Triggering sync workflow for ${{ secrets.REMOTE_OWNER }}/${{ secrets.REMOTE_REPO }}"
        echo "Triggering sync workflow with PAT ${{ secrets.PAT }}"
        curl -X POST \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Authorization: Bearer ${{ secrets.PAT }}" \
          https://api.github.com/repos/${{ secrets.REMOTE_OWNER }}/${{ secrets.REMOTE_REPO }}/actions/workflows/mirror-pr-and-sync.yml/dispatches \
          -d '{"ref":"git-actions", "inputs": {"pr_number": "${{  github.event.pull_request.number }}", "sync_branch": "${{ github.event.pull_request.base.ref }}"}}'
