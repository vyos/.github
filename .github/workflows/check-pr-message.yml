---
  name: Check pull request message format
  
  on:
    workflow_call:

  env:
    GH_TOKEN: ${{ secrets.PAT }}
    TITLE_REGEX: ^(([a-zA-Z0-9\-_.]+:\s)?)T\d+:\s+[^\s]+.*
  
  jobs:
    check-pr-title:
      name: Check pull request title
      runs-on: ubuntu-latest
      permissions:
        pull-requests: write
        contents: read
      steps:
        - uses: actions/checkout@v3
          timeout-minutes: 2
    
        - name: Checkout reusable actions repo
          uses: actions/checkout@v3
          with:
            repository: vyos/.github
            path: reusable-actions
  
        - name: Install the requests library
          run: pip3 install requests
  
        - name: Check the PR title
          timeout-minutes: 2
          run: |
            ls -ltr ./reusable-actions/scripts
            source_pr_title=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json title -q .title)
            echo "source_pr_title=$source_pr_title"
            output=$(python ./reusable-actions/scripts/check_regex.py -i '$source_pr_title' '$TITLE_REGEX')
            if [ "$output" == "false" ]; then
              echo "PR title '$source_pr_title' does not match the required format!"
              echo "error_message=PR title does not match the required format" >> $GITHUB_ENV
              echo "Valid title example: T99999: make IPsec secure"
              exit 1
            fi
            echo "PR title '$source_pr_title' is valid."
            echo "error_message=No issues in PR Title / Commit Title" >> $GITHUB_ENV
        
        - name: Check commit messages
          timeout-minutes: 2
          run: |
            commits=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json commits -q '.commits[].commit.message')
            for commit_message in $commits; do
              output=$(python ./reusable-actions/scripts/check_regex.py -i '$commit_message' '$TITLE_REGEX')
              if [ "$output" == "false" ]; then
                echo "Commit message '$commit_message' does not match the required format!"
                echo "error_message=Commit message does not match the required format!" >> $GITHUB_ENV
                echo "Valid commit message example: T99999: make IPsec secure"
                exit 1
              fi
            done
            echo "All commit messages are valid."
            echo "error_message=No issues in PR Title / Commit Title" >> $GITHUB_ENV

        - name: Add PR comment
          if: always()
          uses: mshick/add-pr-comment@v2
          with:
            message: |-
              ${{ env.error_message == 'No issues in PR Title / Commit Title' && '👍' || '❌' }}
              ${{ env.error_message }}
            message-id: "TITLE_COMMIT_VALIDATION"
            allow-repeats: false