# Reusable workflow for checking PR conflicts
# Usage: uses: vyos/.github/.github/workflows/check-pr-merge-conflict.yml@main
# For development: uses: vyos/.github/.github/workflows/check-pr-merge-conflict.yml@branch
#                  with: action-ref: 'branch'
name: "Check PRs conflict"
on:
  workflow_call:
    inputs:
      action-ref:
        description: 'Branch/tag/SHA to use for the action (should match the workflow ref)'
        required: false
        default: 'current'
        type: string

jobs:
  prs-conflict-Check:
    name: 'Check PRs status: conflicts'
    runs-on: ubuntu-latest
    # Only run if:
    # 1. Not a PR trigger, OR
    # 2. PR trigger with synchronize action, OR  
    # 3. PR trigger with closed action and merged
    if: |
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target' ||
      github.event.action == 'synchronize' ||
      (github.event.action == 'closed' && github.event.pull_request.merged == true)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout .github repository for action
        uses: actions/checkout@v4
        with:
          repository: vyos/.github
          ref: ${{ inputs.action-ref }}
          path: .github-repo

      - name: Check PRs for conflicts
        uses: ./.github-repo/.github/actions/check-pr-conflicts
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          conflict-label: "conflicts"
          max-retries: 10
          retry-delay: 5000