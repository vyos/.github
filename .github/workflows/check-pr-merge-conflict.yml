# Reusable workflow for checking PR conflicts
# Usage: uses: vyos/.github/.github/workflows/check-pr-merge-conflict.yml@production
# For development: uses: vyos/.github/.github/workflows/check-pr-merge-conflict.yml@branch
#                  with: action-ref: 'branch'
name: "Check PRs conflict"
on:
  workflow_call:
    inputs:
      action-ref:
        description: 'Branch/tag/SHA to use for the action (should match the workflow ref)'
        required: false
        default: 'production'
        type: string

jobs:
  prs-conflict-Check:
    name: 'Check PRs status: conflicts'
    runs-on: ubuntu-latest
    # Only run if:
    # 1. Not a PR trigger (scheduled/manual), OR
    # 2. PR trigger with synchronize action, OR  
    # 3. PR trigger with closed action and merged
    if: |
      (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') ||
      ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && 
       (github.event.action == 'synchronize' || 
        (github.event.action == 'closed' && github.event.pull_request.merged == true)))
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout .github repository
        uses: actions/checkout@v6
        with:
          repository: vyos/.github
          ref: ${{ inputs.action-ref }}
          path: .github-repo

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r ./.github-repo/scripts/requirements.txt

      - name: Check PRs for conflicts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFLICT_LABEL: "conflicts"
          MAX_RETRIES: "10"
          RETRY_DELAY: "5"
        run: python ./.github-repo/scripts/check-pr-conflicts.py