# Smoke test for the get-token composite action — manual dispatch only.
# Mints a token for the specified org installation and asserts it was issued.
# Token value is masked.
#
# Single-job composite-action pattern. The prior reusable-workflow form
# (.github/workflows/get-token.yml) failed in production at vyos/.github#124
# because GitHub Actions strips reusable-workflow outputs that contain
# secret-masked values ("Skip output 'token' since it may contain secret"),
# leaving an empty token at the consumer boundary. Composite actions run as
# steps inside the caller job — no output-boundary masking.

name: get-token smoke test

on:
  workflow_dispatch:
    inputs:
      owner:
        description: 'Org to mint for: vyos or VyOS-Networks'
        required: true
        type: choice
        options: [vyos, VyOS-Networks]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Egress audit
        continue-on-error: true
        uses: bullfrogsec/bullfrog@v0.10.0
        with:
          egress-policy: audit
      # Composite actions referenced via `./` path require the repo to be
      # checked out so the action's metadata is on the runner filesystem.
      - name: Checkout (for composite action lookup)
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Mint installation token
        id: token
        uses: ./.github/actions/get-token
        with:
          owner: ${{ inputs.owner }}
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Confirm token was minted
        # Pass workflow context via env vars so the shell sees them as $VAR rather
        # than interpolating directly into the script body — workflow-injection
        # hardening per https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
        env:
          OWNER: ${{ inputs.owner }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "Token minted successfully for owner=${OWNER} (value masked)"
          else
            echo "::error::Token was empty"
            exit 1
          fi
