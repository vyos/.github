
# This workflow uses App tokens only. permissions: {} guarantees GITHUB_TOKEN
# has no scope. Any new uses: or gh/curl step MUST pass an App token explicitly.
# See spec: 2026-05-30-canonical-stub-permissions-fix-design.md
name: PR Mirror and Repo Sync
on:
  workflow_call:
    inputs:
      sync_branch:
        description: 'branch to sync'
        required: false
        type: string
        default: 'rolling'

run-name: Mirror PRs from ${{ github.event.inputs.sync_branch || github.event.pull_request.base.ref }} branch

env:
  SYNC_BRANCH: ${{ github.event.inputs.sync_branch || github.event.pull_request.base.ref }}
  TARGET_REPO: ${{ vars.REMOTE_OWNER }}/${{ github.event.repository.name }}
  SOURCE_REPO: ${{ github.repository }}
  MIRROR_INITIATED_LABEL: 'mirror-initiated'
  MIRROR_COMPLETED_LABEL: 'mirror-completed'
  MIRROR_FAILED_LABEL: 'mirror-failed'
  MIRROR_SKIPPED_LABEL: 'mirror-skipped'
  CONSUMERS_REPO: 'VyOS-Networks/.github'

permissions: {}

concurrency:
  group: trigger-pr-mirror-repo-sync-${{ github.event.inputs.sync_branch || github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  check-consumer-inclusion:
    name: check consumer inclusion
    runs-on: ubuntu-latest
    outputs:
      consumer_found: ${{ steps.lookup.outputs.consumer_found }}
      target: ${{ steps.lookup.outputs.target }}
    steps:
      - name: Bullfrog Secure Runner
        continue-on-error: true
        uses: bullfrogsec/bullfrog@v0.10.0
        with:
          egress-policy: audit

      # Target-side token reads VyOS-Networks/.github (consumers.yaml is on that
      # side). vyos-bot App is installed on both orgs with repository_selection
      # all, so this token has Contents:Read on VyOS-Networks/.github.
      - id: target-token
        uses: vyos/.github/.github/actions/get-token@production
        with:
          owner: VyOS-Networks
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: lookup
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          CALLING_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref || inputs.sync_branch }}
          MIRROR_ENABLED: ${{ vars.MIRROR_ENABLED }}
          # job.workflow_ref is the CALLED workflow's ref in a reusable context
          # (github.workflow_ref would resolve to the CALLER's ref — the wrapper's
          # @production pin — which is not what we want for cross-repo matching).
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          # job.workflow_ref looks like e.g.:
          #   "vyos/.github/.github/workflows/pr-mirror-repo-sync.yml@refs/heads/feature/rollout-2-inclusion"
          # Branch refs: strip everything up to and including "@refs/heads/".
          if [[ "$WORKFLOW_REF" == *"@refs/heads/"* ]]; then
            ref="${WORKFLOW_REF##*@refs/heads/}"
            ref_kind="branch"
          else
            # Tag or SHA — unusual for this workflow. Fall back to production.
            ref="production"
            ref_kind="non-branch-fallback"
          fi
          echo "Reading consumers.yaml from ${CONSUMERS_REPO}@${ref} (ref_kind=${ref_kind})"

          # Probe the ref exists on the consumers repo BEFORE attempting the file
          # read, so we can emit a clear error for the canary-typo case.
          http_status=$(curl -s -o /tmp/branch-probe.json -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${CONSUMERS_REPO}/branches/${ref}")
          if [ "$http_status" != "200" ] && [ "$ref_kind" = "branch" ]; then
            echo "::error::consumers.yaml lookup: ref '${ref}' does not exist on ${CONSUMERS_REPO}"
            echo "::error::This is the canary-typo guard. If you're canarying Rollout 2, ensure"
            echo "::error::the feature branch on ${CONSUMERS_REPO} is named identically to the"
            echo "::error::feature branch on vyos/.github ('${ref}')."
            exit 1
          fi
          if [ "$http_status" != "200" ]; then
            echo "::error::consumers.yaml lookup: fallback ref '${ref}' does not exist on ${CONSUMERS_REPO}"
            exit 1
          fi

          # Read the file:
          http_status=$(curl -s -o /tmp/contents.json -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${CONSUMERS_REPO}/contents/mirror/consumers.yaml?ref=${ref}")
          if [ "$http_status" != "200" ]; then
            echo "::error::consumers.yaml not found at ${CONSUMERS_REPO}@${ref}/mirror/consumers.yaml (HTTP ${http_status})"
            exit 1
          fi
          jq -r '.content' /tmp/contents.json | base64 -d > /tmp/consumers.yaml

          # Find this repo in the list (CALLING_REPO is guaranteed to be in the
          # vyos org by the wrapper-stub `repository_owner == 'vyos'` guard, so
          # injection risk is nil; defense-in-depth via env-only argv).
          consumer=$(CALLING_REPO="$CALLING_REPO" python3 <<'PY'
          import yaml, os, sys, json
          d = yaml.safe_load(open('/tmp/consumers.yaml'))
          target_repo = os.environ['CALLING_REPO']
          for c in d['consumers']:
              if c['source'] == target_repo:
                  print(json.dumps(c)); sys.exit(0)
          print(''); sys.exit(0)
          PY
          )
          if [ -z "$consumer" ]; then
            echo "consumer_found=false" >> $GITHUB_OUTPUT
            echo "mirror-skipped: $CALLING_REPO not in consumers.yaml"
            exit 0
          fi
          # Validate base ref against sync_branches (null-coalesce a missing
          # sync_branches to [] so jq doesn't error on a malformed entry):
          sync_branches=$(echo "$consumer" | jq -r '(.sync_branches // []) | join(",")')
          if [ -n "$BASE_REF" ] && ! echo ",$sync_branches," | grep -q ",$BASE_REF,"; then
            echo "consumer_found=false" >> $GITHUB_OUTPUT
            echo "mirror-skipped: branch $BASE_REF not in sync_branches=[$sync_branches]"
            exit 0
          fi
          # Check kill-switch:
          if [ "$MIRROR_ENABLED" = "false" ]; then
            echo "consumer_found=false" >> $GITHUB_OUTPUT
            echo "mirror-skipped: vars.MIRROR_ENABLED=false"
            exit 0
          fi
          target=$(echo "$consumer" | jq -r '.target')
          echo "consumer_found=true" >> $GITHUB_OUTPUT
          echo "target=$target" >> $GITHUB_OUTPUT
          echo "consumer matched: source=$CALLING_REPO target=$target (read from ${CONSUMERS_REPO}@${ref})"

  reconcile-guard:
    name: reconcile target rolling (guard)
    needs: check-consumer-inclusion
    if: needs.check-consumer-inclusion.outputs.consumer_found == 'true'
    runs-on: ubuntu-latest
    outputs:
      reconciled: ${{ steps.guard.outputs.reconciled }}
      reconcile_action: ${{ steps.guard.outputs.reconcile_action }}
    steps:
      - name: Bullfrog Secure Runner
        continue-on-error: true
        uses: bullfrogsec/bullfrog@v0.10.0
        with:
          egress-policy: audit
      - id: source-token
        uses: vyos/.github/.github/actions/get-token@production
        with:
          owner: vyos
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - id: target-token
        uses: vyos/.github/.github/actions/get-token@production
        with:
          owner: VyOS-Networks
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - id: parse-ref
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          # job.workflow_ref: "vyos/.github/.github/workflows/pr-mirror-repo-sync.yml@refs/heads/feature/..."
          # Extract the ref portion after the "@" so actions/checkout can use it.
          ref="${WORKFLOW_REF##*@}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: vyos/.github
          ref: ${{ steps.parse-ref.outputs.ref }}
          path: _central
          persist-credentials: false
          token: ${{ steps.source-token.outputs.token }}
      - id: guard
        env:
          GH_TOKEN_SOURCE: ${{ steps.source-token.outputs.token }}
          GH_TOKEN_TARGET: ${{ steps.target-token.outputs.token }}
          SOURCE_REPO: ${{ github.repository }}
          TARGET_REPO: ${{ needs.check-consumer-inclusion.outputs.target }}
          SYNC_BRANCH: ${{ github.event.pull_request.base.ref || inputs.sync_branch }}
          RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
          MIRROR_ENABLED: ${{ vars.MIRROR_ENABLED }}
        run: |
          set -euo pipefail
          [ "$SYNC_BRANCH" = "rolling" ] || { echo "reconcile-guard: branch '$SYNC_BRANCH' != rolling; skip"; echo "reconciled=skipped" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$MIRROR_ENABLED" != "false" ] || { echo "reconcile-guard: kill-switch off; skip"; echo "reconciled=skipped" >> "$GITHUB_OUTPUT"; exit 0; }
          # capture the script's reconcile_action (reset|noop) for OBSERVABILITY ONLY — round-5:
          # the reachability replay (B4) runs UNCONDITIONALLY and does NOT branch on it (an
          # interrupted reset must heal on a later run that did no reset). The output is kept for
          # logs/debugging, not consumed as a gate. The guard's job here is to RESET on case 3
          # (rewinding target to merge-base) so B4 then re-reads T_replay = post-reset HEAD.
          out=$(bash _central/.github/scripts/reconcile-rolling.sh \
            "$SOURCE_REPO" "$TARGET_REPO" "$SYNC_BRANCH" GUARD "$RUN_TAG")
          echo "$out"
          action=$(printf '%s\n' "$out" | sed -n 's/^reconcile_action=//p' | tail -1)
          echo "reconciled=ok" >> "$GITHUB_OUTPUT"
          echo "reconcile_action=${action:-noop}" >> "$GITHUB_OUTPUT"

  apply-mirror-skipped-label:
    name: apply mirror-skipped label
    needs: check-consumer-inclusion
    if: |
      needs.check-consumer-inclusion.outputs.consumer_found == 'false'
      && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - id: source-token
        uses: vyos/.github/.github/actions/get-token@production
        with:
          owner: vyos
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Apply mirror-skipped label to source PR
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          # Pass PR number via env to avoid direct ${{ }} interpolation in
          # run: blocks (defense-in-depth — `.number` is integer, but the
          # env-passing pattern is the project convention).
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Ensure the label exists on the source repo before assigning.
          if [[ $(gh label list --repo "$SOURCE_REPO" --json name --jq "[.[].name] | index(\"$MIRROR_SKIPPED_LABEL\") != null") != "true" ]]; then
            echo "Label '$MIRROR_SKIPPED_LABEL' not found in repo. Creating it..."
            gh label create "$MIRROR_SKIPPED_LABEL" --repo "$SOURCE_REPO" --color "cccccc" --description "Mirror was skipped (consumers.yaml exclusion or MIRROR_ENABLED kill-switch)"
          fi
          gh issue edit "$PR_NUMBER" --repo "$SOURCE_REPO" --add-label "$MIRROR_SKIPPED_LABEL"

  get-unmirrored-PRs:
    name: get unmirrored PRs
    needs: [check-consumer-inclusion, reconcile-guard]
    if: |
      needs.check-consumer-inclusion.outputs.consumer_found == 'true'
      && needs.reconcile-guard.outputs.reconciled != ''
    runs-on: ubuntu-latest
    outputs:
      unmirrored_prs: ${{ steps.unmirrored-reachability.outputs.unmirrored_prs }}
      # pr_landing_shas: JSON map {pr_number(str): landing_sha} for per-PR reachability re-check.
      pr_landing_shas: ${{ steps.unmirrored-reachability.outputs.pr_landing_shas }}
    steps:
      - name: Bullfrog Secure Runner
        continue-on-error: true
        uses: bullfrogsec/bullfrog@v0.10.0
        with:
          egress-policy: audit

      - id: source-token
        uses: vyos/.github/.github/actions/get-token@production
        with:
          owner: vyos
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: target-token
        uses: vyos/.github/.github/actions/get-token@production
        with:
          owner: VyOS-Networks
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # ── Reachability replay set — computed EVERY run, NEVER gated on reconcile_action ──
      # reconcile_action is observability-only (round-5: no longer a gate). An interrupted
      # reset, a steady-state new merge, and a direct-push rewind all present identically as
      # "≥1 merged source PR unreachable from T_replay" — one uniform reachability path heals
      # all three. T_replay = current target rolling HEAD post-guard/post-reset.
      # Bounded gap-walk: git rev-list --first-parent T_replay..S → each commit is one PR's
      # landing on source rolling (NOT a paginate over all closed PRs).
      # Fail-closed with retry — NO || true (round-5 spec §6.3 + §7).
      - name: Get unmirrored PRs (reachability — every run)
        id: unmirrored-reachability
        env:
          GH_TOKEN_SOURCE: ${{ steps.source-token.outputs.token }}
          GH_TOKEN_TARGET: ${{ steps.target-token.outputs.token }}
          SOURCE_REPO: ${{ github.repository }}
          TARGET_REPO: ${{ needs.check-consumer-inclusion.outputs.target }}
          SYNC_BRANCH: ${{ github.event.pull_request.base.ref || inputs.sync_branch }}
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); [ "$n" -ge 5 ] && return 1; sleep $((n*3)); done; }
          work="$(mktemp -d)"
          retry git clone --quiet "https://x-access-token:${GH_TOKEN_SOURCE}@github.com/${SOURCE_REPO}.git" "$work/src" \
            || { echo "::error::clone of source failed after retries; fail-closed (NOT empty replay)"; exit 1; }
          cd "$work/src"
          git remote add target "https://x-access-token:${GH_TOKEN_TARGET}@github.com/${TARGET_REPO}.git"
          # explicit destination refspec — a bare `git fetch target <branch>` may only write
          # FETCH_HEAD, NOT refs/remotes/target/<branch> (Codex round-5 finding).
          retry git fetch --quiet target "${SYNC_BRANCH}:refs/remotes/target/${SYNC_BRANCH}" \
            || { echo "::error::fetch of target ${SYNC_BRANCH} (T_replay) failed; fail-closed"; exit 1; }
          # T_replay = the CURRENT target HEAD (post-guard/post-reset). The gap is bounded:
          # --first-parent over T_replay..origin/<branch> yields exactly each PR's landing commit
          # on source rolling (merge commit, or single squash/rebase commit) — one commit per PR in
          # the gap, NOT all closed PRs. This is the spec's "walk S down to first commit reachable
          # from T_replay". The reachable-from-S half is implicit (rev-list only emits S-reachable
          # commits); the not-reachable-from-T_replay half is the `T_replay..` range exclusion.
          gap_commits=$(git rev-list --first-parent --reverse \
            "refs/remotes/target/${SYNC_BRANCH}..origin/${SYNC_BRANCH}")
          out="[]"
          landing="{}"   # {pr_number(str): landing_sha} — the gap-walk SHA, strategy-independent
          for sha in $gap_commits; do
            # Map landing commit -> its merged source PR into rolling. An EMPTY result is retried
            # (commit->PR association lag right after a merge), then FAIL-CLOSED if still empty after
            # retries: a gap commit that maps to no merged PR means we cannot prove the replay set is
            # complete (persistent API lag, or a direct push to source rolling without a PR). NEVER
            # silently skip — that would emit an incomplete replay set and re-strand the commit
            # (Codex adversarial finding). The next run retries automatically; a genuine direct-push
            # anomaly is surfaced for investigation rather than silently propagated.
            prs=""
            attempts=0
            while :; do
              prs=$(GH_TOKEN="$GH_TOKEN_SOURCE" gh api "repos/${SOURCE_REPO}/commits/${sha}/pulls" \
                --jq ".[] | select(.base.ref==\"${SYNC_BRANCH}\" and .merged_at != null) | .number" 2>/dev/null) && rc=0 || rc=1
              if [ "$rc" -eq 0 ] && [ -n "$prs" ]; then break; fi
              attempts=$((attempts+1))
              if [ "$attempts" -ge 5 ]; then
                echo "::error::gap commit ${sha} maps to no merged ${SYNC_BRANCH} PR after ${attempts} attempts (commit->PR association lag, or a direct push to source ${SYNC_BRANCH} without a PR). Cannot prove replay completeness — fail-closed; the next run retries automatically. Investigate the source commit if this persists."
                exit 1
              fi
              sleep $((attempts*3))
            done
            while read -r n; do
              [ -n "$n" ] || continue
              # dedupe: each PR has one --first-parent landing commit.
              if ! echo "$out" | jq -e --argjson n "$n" 'index($n)' >/dev/null; then
                out=$(echo "$out" | jq -c --argjson n "$n" '. + [$n]')
                landing=$(echo "$landing" | jq -c --arg n "$n" --arg s "$sha" '. + {($n): $s}')
              fi
            done <<< "$prs"
          done
          echo "unmirrored_prs=$out" >> "$GITHUB_OUTPUT"
          echo "pr_landing_shas=$landing" >> "$GITHUB_OUTPUT"
          # Non-fatal cleanup (T8943): a spurious `rm: cannot remove .../.git/objects:
          # Directory not empty` (filesystem/handle race) as the step's last command would
          # fail the step under set -e. The outputs above are already written; runner is
          # ephemeral — never let cleanup gate the result.
          rm -rf "$work" 2>/dev/null || true


  process-unmirrored-PR:
    needs: [get-unmirrored-PRs, reconcile-guard]
    if: needs.get-unmirrored-PRs.outputs.unmirrored_prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pr_number: ${{ fromJson(needs.get-unmirrored-PRs.outputs.unmirrored_prs) }}
      # Serial ordering — ascending landing order from the gap-walk (--first-parent oldest-first).
      # Ordering invariant enforced structurally (max-parallel:1 + gap-walk ascending + per-PR
      # reachability re-check); no longer encoded in labels (B4 Step 3.7 removed label gate).
      max-parallel: 1
    env:
      PR_NUMBER: ${{ matrix.pr_number }}
    steps:

      - id: source-token
        uses: vyos/.github/.github/actions/get-token@production
        with:
          owner: vyos
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - id: target-token
        uses: vyos/.github/.github/actions/get-token@production
        with:
          owner: VyOS-Networks
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check PR mirror required
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          # B4 Step 3 (round-5): matrix membership is reachability-authoritative — a PR is in
          # the matrix iff its landing commit is absent from T_replay. The old label-skip
          # (mirror-completed/mirror-initiated → mirror_required=false) is REMOVED: a stale
          # terminal label on a rewound commit must NOT no-op the replay. Set true unconditionally;
          # the per-PR reachability re-check below (Step 3.5) is the only legitimate skip.
          # Do NOT clear terminal labels here (Codex adversarial finding): the re-check may skip
          # this PR (already reachable via an earlier serial item), in which case its commit IS on
          # target and an existing mirror-completed label is CORRECT — clearing it would leave a
          # reachable-but-unlabeled source PR. On the PROCEED path the normal flow re-labels
          # (mirror-initiated → mirror-completed at the end), overwriting any stale state.
          echo "mirror_required=true" >> $GITHUB_ENV

      # ── B4 Step 3.5: Per-PR reachability re-check (every matrix item, before any side effect) ──
      # With max-parallel:1, mirroring earlier PRs advances target rolling, which can make a
      # later PR's landing commit reachable before its turn. Re-check here and skip if already
      # reachable — avoids a redundant empty mirror PR.
      # STEP ORDER (load-bearing): runs AFTER Check PR mirror required (which sets true) and
      # BEFORE Add mirror-initiated label (first side effect). Last writer to $GITHUB_ENV wins.
      # Self-contained: does NOT use $checkout_folder (created later). Uses LANDING_MAP (the
      # gap-walk SHA — strategy-independent) with mergeCommit.oid as fallback.
      - name: Per-PR reachability re-check
        env:
          GH_TOKEN_SOURCE: ${{ steps.source-token.outputs.token }}
          GH_TOKEN_TARGET: ${{ steps.target-token.outputs.token }}
          LANDING_MAP: ${{ needs.get-unmirrored-PRs.outputs.pr_landing_shas }}
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n+1)); [ "$n" -ge 5 ] && return 1; sleep $((n*3)); done; }
          # PRIMARY: the gap-walk SHA (strategy-independent).
          # FALLBACK: .mergeCommit.oid (for cases where gap-map has no entry — should not
          # happen for replay-set members, but defensive).
          msha=$(printf '%s' "$LANDING_MAP" | jq -r --arg n "$PR_NUMBER" '.[$n] // empty')
          if [ -z "$msha" ]; then
            msha=$(GH_TOKEN="$GH_TOKEN_SOURCE" gh pr view "$PR_NUMBER" --repo "$SOURCE_REPO" \
              --json mergeCommit --jq '.mergeCommit.oid // empty')
          fi
          [ -n "$msha" ] || { echo "::error::PR ${PR_NUMBER}: no landing SHA in gap map and no mergeCommit; fail-closed"; exit 1; }
          # SELF-CONTAINED: own temp clone; does NOT reference $checkout_folder (created later).
          # Fetch current target rolling (advanced by earlier max-parallel:1 items this run).
          rc="$(mktemp -d)"
          retry git clone --quiet --no-checkout "https://x-access-token:${GH_TOKEN_SOURCE}@github.com/${SOURCE_REPO}.git" "$rc" \
            || { echo "::error::re-check clone failed; fail-closed"; exit 1; }
          cd "$rc"
          git remote add target "https://x-access-token:${GH_TOKEN_TARGET}@github.com/${TARGET_REPO}.git"
          # explicit destination refspec (Codex round-5): a bare `git fetch target <branch>`
          # may only set FETCH_HEAD, not refs/remotes/target/<branch>.
          retry git fetch --quiet target "${SYNC_BRANCH}:refs/remotes/target/${SYNC_BRANCH}" \
            || { echo "::error::re-check fetch of target failed; fail-closed"; exit 1; }
          if git merge-base --is-ancestor "$msha" "refs/remotes/target/${SYNC_BRANCH}" 2>/dev/null; then
            echo "PR ${PR_NUMBER} landing commit ${msha} is NOW reachable from target (carried by an earlier replay item); skipping"
            echo "mirror_required=false" >> "$GITHUB_ENV"
          else
            echo "PR ${PR_NUMBER} still absent from target; proceeding"
            echo "mirror_required=true" >> "$GITHUB_ENV"
          fi
          # Non-fatal cleanup (T8943): a spurious temp-dir rm failure under set -e would fail
          # the step AFTER the reachability decision above, stranding the PR as mirror-failed.
          # The decision is already recorded in $GITHUB_ENV; runner is ephemeral.
          cd - >/dev/null; rm -rf "$rc" 2>/dev/null || true

      # ── Side effect #1: Apply mirror-initiated label on source PR ──
      - name: Re-check kill-switch before side effect
        if: env.mirror_required == 'true'
        env:
          MIRROR_ENABLED: ${{ vars.MIRROR_ENABLED }}
        run: |
          if [ "$MIRROR_ENABLED" = "false" ]; then
            echo "::error::kill-switch flipped to false mid-run; aborting before side effect (initiated-label)"
            exit 1
          fi

      - name: Add mirror-initiated label
        if: env.mirror_required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          label_name="${MIRROR_INITIATED_LABEL}"

          if [[ $(gh label list --repo "$SOURCE_REPO" --json name --jq "[.[].name] | index(\"$label_name\") != null") != "true" ]]; then
            echo "Label '$label_name' not found in repo. Creating it..."
            gh label create "$label_name" --repo "$SOURCE_REPO" --color "ff0000" --description "This PR initiated for mirror sync workflow"
          else
            echo "Label '$label_name' already exists."
          fi

          gh issue edit "$PR_NUMBER" --repo "$SOURCE_REPO" --add-label "$label_name"
          # round-5 (adversarial Low): on the PROCEED path only, clear any stale mirror-completed
          # so a rewound PR that re-mirrors then FAILS ends with just mirror-failed — not a
          # misleading completed+failed pair. This step is gated `mirror_required == 'true'`, so the
          # reachability-skip path (a reachable PR whose mirror-completed is correct) is untouched.
          # Tolerant of "label not present" (a normal new PR has no mirror-completed yet).
          gh issue edit "$PR_NUMBER" --repo "$SOURCE_REPO" --remove-label "$MIRROR_COMPLETED_LABEL" 2>/dev/null || true

      - name: Create checkout folder
        if: env.mirror_required == 'true'
        run: |
          checkout_folder="/tmp/mirror/${PR_NUMBER}"
          echo "checkout_folder=${checkout_folder}" >> $GITHUB_ENV
          mkdir -p $checkout_folder

      - name: Checkout source repo
        if: env.mirror_required == 'true'
        run: |
          cd $checkout_folder
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git init
          git remote add origin https://x-access-token:${{ steps.source-token.outputs.token }}@github.com/${SOURCE_REPO}.git
          git fetch
          git checkout -b $SYNC_BRANCH

      - name: Get source PR info
        if: env.mirror_required == 'true'
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          cd $checkout_folder
          pr_info=$(gh pr view $PR_NUMBER --repo $SOURCE_REPO --json commits,mergeCommit,body,title,labels,headRefOid)
          echo "PR info retrieved ${pr_info}"
          last_commit=$(echo $pr_info | jq -r '.headRefOid')
          echo "Last commit retrieved from pr view ${last_commit}"
          merge_commit=$(echo $pr_info | jq -r '.mergeCommit.oid')
          pr_body=$(echo "$pr_info" | jq -j '.body')   # preserve indentation
          pr_title=$(echo $pr_info | jq -r '.title')
          echo "pr_title=${pr_title}" >> $GITHUB_ENV
          pr_labels=$(echo $pr_info | jq -r '.labels | map(.name) | join(",")')
          echo "pr_labels=${pr_labels}" >> $GITHUB_ENV
          if [[ $merge_commit == null ]]; then
            echo "Merge commit not found, getting merge commit in base branch by merge message"
            merge_commit=$(git log origin/${SYNC_BRANCH} --pretty=format:"%H" --grep "Merge pull request #${PR_NUMBER} from" -1)
            if [[ -z "$merge_commit" ]]; then
              echo "Merge commit not found, getting merge commit in base branch by pr title message"
              escaped_pr_title=$(echo "$pr_title" | sed 's/"/\\"/g')
              merge_commit=$(git log origin/${SYNC_BRANCH} --pretty=format:"%H" --grep "${escaped_pr_title}" -1)
              if [[ -z "$merge_commit" ]]; then
                echo "No merge commit found for PR #${PR_NUMBER} in base branch"
                exit 1
              fi
            fi
          fi
          if ! git branch --contains ${last_commit}; then
            echo "Last commit not found in the $SYNC_BRANCH branch, using merge commit as last_commit"
            last_commit=${merge_commit}
          fi
          echo "last_commit=${last_commit}" >> $GITHUB_ENV
          echo "merge_commit=${merge_commit}" >> $GITHUB_ENV
          # Write link-only PR body to a tmp file (spec §4.2.6 — no source body in mirror chain).
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "**Note**: This pull request is mirrored from PR [$PR_NUMBER](https://github.com/${SOURCE_REPO}/pull/${PR_NUMBER}) using [workflow run](${run_url})."
            echo ""
            echo "Mirror PR body is link-only — no LTS metadata in the mirror chain."
            echo "Backport intent lives on this mirror PR: Maintainers post a backport command post-merge."
          } > /tmp/pr_body.txt
          echo "Last commit retrieved ${last_commit}, Merge commit retrieved ${merge_commit}, PR labels retrieved ${pr_labels}"

      # ── Side effect #2: Clone source + force-push mirror/<sync_branch>/<pr> to target ──
      - name: Re-check kill-switch before side effect
        if: env.mirror_required == 'true'
        env:
          MIRROR_ENABLED: ${{ vars.MIRROR_ENABLED }}
        run: |
          if [ "$MIRROR_ENABLED" = "false" ]; then
            echo "::error::kill-switch flipped to false mid-run; aborting before side effect (push temp branch)"
            exit 1
          fi

      - name: Create mirror PR head branch (temp feature branch)
        if: env.mirror_required == 'true'
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          pr_head_branch="mirror/${SYNC_BRANCH}/${PR_NUMBER}"
          echo "pr_head_branch=${pr_head_branch}" >> $GITHUB_ENV
          if gh api repos/$TARGET_REPO/git/refs/heads/${pr_head_branch} &> /dev/null; then
            gh api -X DELETE repos/${TARGET_REPO}/git/refs/heads/${pr_head_branch}
          fi
          cd $checkout_folder
          git checkout -b $pr_head_branch $last_commit
          git remote add target https://x-access-token:${{ steps.target-token.outputs.token }}@github.com/${TARGET_REPO}.git
          git push target $pr_head_branch

      # ── Side effect #3: Open mirror PR on target ──
      - name: Re-check kill-switch before side effect
        if: env.mirror_required == 'true'
        env:
          MIRROR_ENABLED: ${{ vars.MIRROR_ENABLED }}
        run: |
          if [ "$MIRROR_ENABLED" = "false" ]; then
            echo "::error::kill-switch flipped to false mid-run; aborting before side effect (open mirror PR)"
            exit 1
          fi

      - name: Create mirror PR
        if: env.mirror_required == 'true'
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          title="${pr_title} (mirror ${PR_NUMBER})"
          pr_url=$(gh pr create \
            --repo ${TARGET_REPO} \
            --head $pr_head_branch \
            --base $SYNC_BRANCH \
            --title "${title}" \
            --body-file /tmp/pr_body.txt)
          echo "Created PR url retrieved ${pr_url}"
          pr_number=$(basename $pr_url)
          echo "mirror_pr_number=${pr_number}" >> $GITHUB_ENV

      # ── Side effect #4: Apply backport-pending label to mirror PR (marker only) ──
      - name: Re-check kill-switch before side effect
        if: env.mirror_required == 'true'
        env:
          MIRROR_ENABLED: ${{ vars.MIRROR_ENABLED }}
        run: |
          if [ "$MIRROR_ENABLED" = "false" ]; then
            echo "::error::kill-switch flipped to false mid-run; aborting before side effect (backport-pending label)"
            exit 1
          fi

      - name: Apply backport-pending label to mirror PR
        if: env.mirror_required == 'true'
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          # Ensure the label exists on the target repo before applying it — mirrors the
          # create_label_if_not_exists pattern used for other mirror labels in this workflow.
          if [[ $(gh label list --repo "$TARGET_REPO" --json name --jq '[.[].name] | index("backport-pending") != null') != "true" ]]; then
            gh label create "backport-pending" --repo "$TARGET_REPO" --color "fbca04" \
              --description "Mirror PR awaiting an LTS backport decision"
          fi
          gh api -X POST \
            "repos/${TARGET_REPO}/issues/${mirror_pr_number}/labels" \
            -f "labels[]=backport-pending"

      # ── Side effect #5: Auto-merge mirror PR ──
      - name: Re-check kill-switch before side effect
        if: env.mirror_required == 'true'
        env:
          MIRROR_ENABLED: ${{ vars.MIRROR_ENABLED }}
        run: |
          if [ "$MIRROR_ENABLED" = "false" ]; then
            echo "::error::kill-switch flipped to false mid-run; aborting before side effect (merge mirror PR)"
            exit 1
          fi

      # B3 Step 1a: Record pre-merge target HEAD (for logging; M is the authoritative lease baseline)
      - name: Record pre-merge target HEAD
        if: env.mirror_required == 'true'
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          set -euo pipefail
          pre=$(gh api "repos/${TARGET_REPO}/git/ref/heads/${SYNC_BRANCH}" --jq .object.sha)
          echo "pre_merge_head=$pre" >> "$GITHUB_ENV"

      - name: Merge mirror PR
        if: env.mirror_required == 'true'
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          GH_TOKEN_SOURCE: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          # Fail-closed preconditions — admin-merge bypasses target-side gating, so only proceed
          # when this is provably a bot port of validated source content (spec §4, Codex #4):
          #   source PR MERGED with non-null mergeCommit.oid; mirror PR OPEN, correct base, MERGEABLE.
          src_state=$(GH_TOKEN="$GH_TOKEN_SOURCE" gh pr view "$PR_NUMBER" --repo "$SOURCE_REPO" \
            --json state,mergeCommit --jq '"\(.state) \(.mergeCommit.oid // "")"')
          case "$src_state" in MERGED\ ?*) ;; *) echo "::error::source PR ${SOURCE_REPO}#${PR_NUMBER} not MERGED-with-mergeCommit ($src_state); refuse admin-merge"; exit 1;; esac
          # Bound-poll mergeability: require MERGEABLE (computed + no conflict). Reject CONFLICTING
          # or persistent UNKNOWN — UNKNOWN does not prove "no conflict" (spec §4, Codex round-2 Low).
          mpr_mergeable=UNKNOWN
          for _i in $(seq 1 12); do
            read -r mpr_state mpr_base mpr_head mpr_mergeable < <(gh pr view "$mirror_pr_number" --repo "$TARGET_REPO" \
              --json state,baseRefName,headRefOid,mergeable --jq '"\(.state) \(.baseRefName) \(.headRefOid) \(.mergeable)"')
            [ "$mpr_mergeable" = "MERGEABLE" ] && break
            [ "$mpr_mergeable" = "CONFLICTING" ] && break
            sleep 5
          done
          [ "$mpr_state" = "OPEN" ] && [ "$mpr_base" = "$SYNC_BRANCH" ] && [ "$mpr_mergeable" = "MERGEABLE" ] \
            || { echo "::error::mirror PR ${TARGET_REPO}#${mirror_pr_number} precondition fail (state=$mpr_state base=$mpr_base mergeable=$mpr_mergeable); refuse admin-merge"; exit 1; }
          # Prove the mirror PR head is EXACTLY the head this run created — $last_commit is the source
          # PR head the mirror branch ($pr_head_branch) was created/pushed at (the "Create mirror PR
          # head branch" step). Comparing the current mirror head to $last_commit (not just to a value
          # read a moment ago) is what proves "this is the head we created" and rejects any out-of-band
          # mirror-branch update (Codex round-1 #2). Then pin the merge to that expected SHA.
          [ -n "${last_commit:-}" ] || { echo "::error::last_commit unset at merge step; cannot verify mirror head"; exit 1; }
          [ "$mpr_head" = "$last_commit" ] || { echo "::error::mirror PR ${TARGET_REPO}#${mirror_pr_number} head $mpr_head != expected $last_commit (out-of-band update); refuse admin-merge"; exit 1; }
          # Admin-merge, head-pinned to the expected SHA. --admin exercises vyos-bot's ruleset bypass
          # deterministically; --match-head-commit guarantees we merge only the validated head.
          if ! gh pr merge --repo "$TARGET_REPO" --merge --admin --match-head-commit "$last_commit" "$mirror_pr_number"; then
            echo "::error::mirror PR ${TARGET_REPO}#${mirror_pr_number} admin-merge failed (expected head $last_commit)"
            exit 1
          fi

      # B3 Step 1b: Capture mirror PR merge commit (lease baseline M).
      # Poll until the mirror PR reports mergeCommit.oid (state==MERGED), then require
      # target HEAD == M exactly. If HEAD is already beyond M an out-of-band push landed
      # after our merge — abort before the terminal force-push so we don't overwrite it.
      # (Supersedes the blind sleep 10 / "Wait for GitHub PR merge propagation".)
      - name: Capture mirror PR merge commit (lease baseline M)
        if: env.mirror_required == 'true'
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          set -euo pipefail
          M=""
          for _i in $(seq 1 24); do
            M=$(gh pr view "$mirror_pr_number" --repo "${TARGET_REPO}" --json mergeCommit,state \
                  --jq 'select(.state=="MERGED") | .mergeCommit.oid' 2>/dev/null || echo "")
            [ -n "$M" ] && break
            sleep 5
          done
          [ -n "$M" ] || { echo "::error::mirror PR ${mirror_pr_number} not MERGED / no mergeCommit after 2 min; abort"; exit 1; }
          # Require current target HEAD to be exactly M. If it is beyond M, an out-of-band
          # push landed after our merge — abort before the terminal force-push so we don't
          # overwrite it unbacked. (next run's reconcile-guard will back it up and heal)
          cur=$(gh api "repos/${TARGET_REPO}/git/ref/heads/${SYNC_BRANCH}" --jq .object.sha)
          if [ "$cur" != "$M" ]; then
            echo "::error::target ${SYNC_BRANCH} HEAD ($cur) != mirror merge commit M ($M) — out-of-band push detected; aborting before terminal force-push"
            exit 1
          fi
          # Also assert M's first parent is exactly pre_merge_head. The cur==M check above catches an
          # out-of-band push landing AFTER our merge, but a push landing in the (up to ~60s) window
          # BETWEEN pre_merge_head capture and the merge is absorbed as M's first parent — it would
          # pass cur==M and then be silently dropped by the terminal force-push (leased against M).
          # The pre-admin-merge code failed safe here (BLOCKED→job fails→no force-push); --admin
          # removes that fail-safe, so guard it explicitly. Fail closed: next run's reconcile-guard
          # backs up + heals. (Consumes pre_merge_head, previously captured for logging only.)
          mp1=$(gh api "repos/${TARGET_REPO}/commits/${M}" --jq '.parents[0].sha // ""')
          if [ "$mp1" != "${pre_merge_head:-}" ]; then
            echo "::error::mirror merge commit M ($M) first parent ($mp1) != pre_merge_head (${pre_merge_head:-unset}) — target advanced between pre-merge capture and merge; aborting before terminal force-push"
            exit 1
          fi
          echo "post_merge_head=$M" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        if: env.mirror_required == 'true'
        with:
          persist-credentials: false
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.SYNC_BRANCH }}
          token: ${{ steps.target-token.outputs.token }}

      # ── Side effect #5: Force-push source last_commit + merge_commit to target train branch ──
      - name: Re-check kill-switch before side effect
        if: env.mirror_required == 'true'
        env:
          MIRROR_ENABLED: ${{ vars.MIRROR_ENABLED }}
        run: |
          if [ "$MIRROR_ENABLED" = "false" ]; then
            echo "::error::kill-switch flipped to false mid-run; aborting before side effect (force-push to train)"
            exit 1
          fi

      - name: Repo sync source repo PR commit
        if: env.mirror_required == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          set -e
          source_repo_url="https://github.com/${SOURCE_REPO}.git"
          git config --unset-all http."https://github.com/".extraheader || :
          # Use x-access-token literal as username (App installation token requires
          # this form per GitHub docs; PAT historically accepted $GITHUB_ACTOR as
          # username so the prior form worked under PAT, but App tokens require
          # the documented x-access-token literal).
          git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/${TARGET_REPO}"
          git remote add tmp_source "$source_repo_url"
          git fetch tmp_source --quiet
          # B3 Step 2 (round-5 single push): content = merge_commit (source PR mergeCommit.oid);
          # lease expected-value = post_merge_head (M = target-side mirror-merge commit).
          # One push carries last_commit transitively: last_commit is an ancestor of merge_commit
          # on a standard merge, or EQUAL to it via the squash/rebase fallback (lines above:
          # `if ! git branch --contains last_commit; then last_commit=merge_commit`).
          # This collapses the prior two-step push (last_commit, then merge_commit) to one —
          # removing the intermediate-state hole where a failed 2nd push left target at
          # last_commit (next run misread as case-2/no-op).
          # Lease against M (NOT latest HEAD): a human push U after merge makes latest != M,
          # failing the lease (vs silently overwriting U). On lease failure do NOT retry blind.
          if ! git push origin "${merge_commit}:refs/heads/${SYNC_BRANCH}" --force-with-lease="refs/heads/${SYNC_BRANCH}:${post_merge_head}"; then
            echo "::error::terminal force-push lease failed (target moved past post-merge HEAD ${post_merge_head}); out-of-band push detected — aborting before overwrite"
            exit 1
          fi
          git remote rm tmp_source

      # ── Side effect #6: Swap source PR label mirror-initiated → mirror-completed/-failed ──
      # NOTE: this step intentionally fires on `always()` so that mid-run aborts
      # (including those triggered by the kill-switch re-checks above) still leave
      # the source PR labeled mirror-failed. The kill-switch check here is therefore
      # purely advisory — it logs the abort but does not exit-1, allowing the label
      # swap to proceed and surface the abort condition correctly.
      - name: Re-check kill-switch before side effect
        if: always() && env.mirror_required == 'true'
        env:
          MIRROR_ENABLED: ${{ vars.MIRROR_ENABLED }}
        run: |
          if [ "$MIRROR_ENABLED" = "false" ]; then
            echo "::warning::kill-switch is false at label-swap step; allowing mirror-failed to be applied to source PR"
          fi

      - name: Add process labels to source PR
        shell: bash
        if: always() && env.mirror_required == 'true'
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          create_label_if_not_exists() {
            local repo=$1
            local label_name=$2
            local label_color=$3
            local label_description=$4

            if [[ $(gh label list --repo "$repo" --json name --jq "[.[].name] | index(\"$label_name\") != null") != "true" ]]; then
              echo "Label '$label_name' not found in repo. Creating it..."
              gh label create "$label_name" --color "$label_color" --description "$label_description" --repo "$repo"
            else
              echo "Label '$label_name' already exists."
            fi
          }

          gh issue edit "$PR_NUMBER" --repo "${SOURCE_REPO}" --remove-label "${MIRROR_INITIATED_LABEL}"

          if [ "${{ job.status }}" == "success" ]; then
            create_label_if_not_exists "${SOURCE_REPO}" "${MIRROR_COMPLETED_LABEL}" "00ff00" "This PR has been mirrored successfully"
            gh issue edit "$PR_NUMBER" --repo "${SOURCE_REPO}" --add-label "${MIRROR_COMPLETED_LABEL}"

            # Remove mirror-failed if exists
            if [[ $(gh issue view "$PR_NUMBER" --repo "${SOURCE_REPO}" --json labels --jq "[.labels[].name] | index(\"${MIRROR_FAILED_LABEL}\") != null") == "true" ]]; then
              gh issue edit "$PR_NUMBER" --repo "${SOURCE_REPO}" --remove-label "${MIRROR_FAILED_LABEL}"
            fi
          else
            create_label_if_not_exists "${SOURCE_REPO}" "${MIRROR_FAILED_LABEL}" "ff0000" "This PR mirror has failed"
            gh issue edit "$PR_NUMBER" --repo "${SOURCE_REPO}" --add-label "${MIRROR_FAILED_LABEL}"
          fi

      # ── Side effect #7: Delete temporary mirror/<sync_branch>/<pr> ref on target ──
      - name: Re-check kill-switch before side effect
        if: always() && env.mirror_required == 'true'
        env:
          MIRROR_ENABLED: ${{ vars.MIRROR_ENABLED }}
        run: |
          if [ "$MIRROR_ENABLED" = "false" ]; then
            echo "::warning::kill-switch is false at temp-branch cleanup; allowing cleanup to proceed"
          fi

      - name: Cleanup mirror PR temp branch
        if: always() && env.mirror_required == 'true'
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          echo "Cleaning up temp branch: $pr_head_branch from ${TARGET_REPO}"
          if gh api repos/${TARGET_REPO}/git/refs/heads/${pr_head_branch} &> /dev/null; then
            gh api -X DELETE repos/${TARGET_REPO}/git/refs/heads/${pr_head_branch}
            echo "Deleted temp branch: ${pr_head_branch}"
          else
            echo "Temp branch ${pr_head_branch} does not exist or already deleted"
          fi
