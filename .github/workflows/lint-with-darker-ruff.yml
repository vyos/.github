---
name: Darker-Ruff Lint

on:
  workflow_call:

jobs:
  darker-ruff-lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:

      - name: Checkout head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Fetch base
        run: |
          git fetch https://github.com/${{ github.event.pull_request.base.repo.full_name }} ${{ github.event.pull_request.base.ref }}:refs/remotes/origin/base

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install darker ruff 
        run: |
          pip install git+https://github.com/akaihola/darker.git@master#egg=darker[black] ruff>=0.0.292

      - name: Install greylint
        run: |
          pip install graylint==2.0.0

      - name: Run Darker
        id: darker
        run: |
          if git ls-tree -r origin/base --name-only | grep -q '^pyproject.toml$'; then
            git checkout origin/base -- pyproject.toml
            echo "Using pyproject.toml from base repo"
          else
            echo "No pyproject.toml found in base repo"
          fi
          if ! darker -r origin/base --check --diff --color .; then
            echo "darker_failed=1" >> $GITHUB_OUTPUT
          fi

      - name: Run Graylint
        id: graylint
        run: |
          if git ls-tree -r origin/base --name-only | grep -q '^ruff.toml$'; then
            git checkout origin/base -- ruff.toml
            echo "Using ruff.toml from base repo"
          else
            echo "No ruff.toml found in base repo"
          fi
          if ! graylint -L "ruff check" --revision origin/base .; then
            echo "graylint_failed=1" >> $GITHUB_OUTPUT
          fi

      - name: Fail if any linter failed
        run: |
          echo "### 🧪 Lint Results"
          darker_failed="${{ steps.darker.outputs.darker_failed }}"
          graylint_failed="${{ steps.graylint.outputs.graylint_failed }}"
          
          if [[ "$darker_failed" == "1" ]]; then
            echo "- ❌ **Darker** check failed"
          else
            echo "- ✅ **Darker** check passed"
          fi

          if [[ "$graylint_failed" == "1" ]]; then
            echo "- ❌ **Graylint (ruff check)** failed"
          else
            echo "- ✅ **Graylint (ruff check)** passed"
          fi

          if [[ "$darker_failed" == "1" || "$graylint_failed" == "1" ]]; then
            echo "::error::One or more linters failed. See above for details."
            exit 1
          else
            echo "✅ All linters passed"
          fi
