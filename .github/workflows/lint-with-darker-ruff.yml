---
name: Darker-Ruff Lint

on:
  workflow_call:

jobs:
  darker-ruff-lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:

      - name: Checkout head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Fetch base
        run: |
          git fetch https://github.com/${{ github.event.pull_request.base.repo.full_name }} ${{ github.event.pull_request.base.ref }}:refs/remotes/origin/base

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install darker ruff 
        run: |
          pip install git+https://github.com/akaihola/darker.git@master ruff>=0.0.292

      - name: Install greylint
        run: |
          pip install graylint==2.0.0

      - name: Run Darker
        run: |
          if git ls-tree -r origin/base --name-only | grep -q '^pyproject.toml$'; then
            git checkout origin/base -- pyproject.toml
            echo "Using pyproject.toml from base repo"
          else
            echo "No pyproject.toml found in base repo"
          fi
          darker -r origin/base --check --diff --color .
        continue-on-error: true

      - name: Run Graylint
        run: |
          if git ls-tree -r origin/base --name-only | grep -q '^ruff.toml$'; then
            git checkout origin/base -- ruff.toml
            echo "Using ruff.toml from base repo"
          else
            echo "No ruff.toml found in base repo"
          fi
          graylint -L "ruff check" --revision origin/base
        continue-on-error: true