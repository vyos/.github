name: Cleanup pr mirror branch

on:
  workflow_call:

run-name: Cleanup branch ${{ github.event.pull_request.head.ref }}

permissions:
  contents: write

jobs:
  delete_branch:
    if: ${{ false && startsWith(github.event.pull_request.head.ref, 'mirror/') && github.repository_owner != 'vyos' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete branch
        run: |
          branch=${{ github.event.pull_request.head.ref }}
          if [[ $branch != mirror/* ]]; then
            echo "Branch name to clean must start with 'mirror/'"
            exit 1
          fi
          repo=${{ github.repository }}
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin --delete $branch
