# .github/workflows/force-workspace-parser-smoke.yml
name: force_workspace parser smoke test

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Bullfrog Secure Runner
        continue-on-error: true
        uses: bullfrogsec/bullfrog@v0.8.4
        with:
          egress-policy: audit
      - name: Assert parser produces EXACT expected SHA + branch on fixtures
        run: |
          set -euo pipefail
          # Use the EXACT same parser as force-workspace-backport.yml.
          # This block must stay in lockstep with the parser there.
          python3 - <<'PYEOF'
          import re, sys

          # Fixtures: each is (body, expected_sha, expected_branch). expected_sha=None means the
          # parser MUST REJECT (ambiguous or no anchored commit SHA) — negative cases.
          FIXTURES = [
            # Positive: SHA in "cherry-pick of commit <sha>" context, branch in "to/for branch".
            ("""The backport of pull request #42 to branch sagitta failed.

          No backport have been created for branch sagitta. The cherry-pick of commit abc123def4567890abcdef1234567890abcdef12 failed:""",
             "abc123def4567890abcdef1234567890abcdef12", "sagitta"),
            # Positive: "Backport of <sha> to <branch>" context.
            ("""Backport of abcdef1234567890abcdef1234567890abcdef12 to circinus failed: deleted by us.""",
             "abcdef1234567890abcdef1234567890abcdef12", "circinus"),
            # NEGATIVE: failure branch present but the only 40-hex is an UNRELATED bare SHA in a URL
            # (no commit/Backport-of anchor) → anchored SHA_RE finds 0 → must REJECT (not pair a stray SHA).
            ("""No backport have been created for branch sagitta.
          See https://github.com/vyos/vyos-1x/commit/0000000000000000000000000000000000000000 for context.""",
             None, None),
            # NEGATIVE: two distinct anchored commit SHAs → ambiguous → must REJECT.
            ("""Backport of 1111111111111111111111111111111111111111 to circinus failed.
          The cherry-pick of commit 2222222222222222222222222222222222222222 also failed.""",
             None, None),
          ]

          BRANCH_RE = r"\b(?:to(?: branch)?|for branch)\s+(sagitta|circinus)\b"
          SHA_RE = r"\b(?:commit|Backport of)\s+([0-9a-f]{40})\b"

          # Lockstep with the reusable's parser: set-based with exactly-one-distinct assertion
          # (anchored/ambiguity-safe). Keep identical to force-workspace-backport.yml's parse step.
          failed = False
          for body, expected_sha, expected_branch in FIXTURES:
              shas = sorted(set(re.findall(SHA_RE, body, re.IGNORECASE)))
              branches = sorted({m.lower() for m in re.findall(BRANCH_RE, body, re.IGNORECASE)})
              rejected = (len(shas) != 1 or len(branches) != 1)
              if expected_sha is None:
                  # Negative fixture: the parser MUST reject (ambiguous / no anchored commit SHA).
                  if rejected:
                      print(f"OK (negative): correctly rejected — shas={shas} branches={branches}")
                  else:
                      print(f"FAIL (negative): expected rejection but extracted sha={shas} branch={branches}", file=sys.stderr)
                      failed = True
                  continue
              if rejected:
                  print(f"FAIL: ambiguous/none — shas={shas} branches={branches}", file=sys.stderr)
                  failed = True
                  continue
              if shas[0] != expected_sha:
                  print(f"FAIL: sha mismatch — expected {expected_sha}, got {shas[0]}", file=sys.stderr)
                  failed = True
                  continue
              if branches[0] != expected_branch:
                  print(f"FAIL: branch mismatch — expected {expected_branch}, got {branches[0]}", file=sys.stderr)
                  failed = True
                  continue
              print(f"OK: sha={shas[0]} branch={branches[0]}")
          if failed:
              sys.exit(1)
          PYEOF

      # v7: Slack notify step REMOVED — SLACK_BOT_TOKEN / SLACK_VYOS_INFRA_CHANNEL_ID are not
      # provisioned in either org (verified 2026-06-01). The smoke job's own red run status on
      # `schedule` is the drift alert (visible in the Actions tab + any repo-level failure
      # notifications). When the GHA-failure-notifications initiative provisions Slack secrets,
      # wire a notify step here at that point (it would gate `if: failure() && secrets present`).
